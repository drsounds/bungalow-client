<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} &mdash; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<div id="header">
  <div id="header-inner">
    <a id="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span id="tagline">plugin operating system for music</span>
  </div>
</div>

<div id="navbar">
  <div id="navbar-inner">
    {% assign nav_pages = site.html_pages | sort: "nav_order" %}
    {% for p in nav_pages %}<a href="{{ p.url | relative_url }}"{% if p.url == page.url %} class="current"{% endif %}>{{ p.nav_title | default: p.title }}</a>{% unless forloop.last %} <span class="sep">|</span> {% endunless %}{% endfor %}
  </div>
</div>

<div id="wrapper">
  <div id="content">
    {{ content }}
  </div>
</div>

<div id="footer">
  <div id="footer-inner">
    <p>Bungalow &mdash; documentation. Source on <a href="https://github.com/{{ site.repository }}">GitHub</a>.</p>
  </div>
</div>

</body>
</html>
