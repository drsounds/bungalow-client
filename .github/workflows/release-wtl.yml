name: Release WTL build

on:
  # Automatic triggers disabled for now; run manually from the Actions tab.
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check out WTL headers
        uses: actions/checkout@v4.2.2
        with:
          repository: Win32-WTL/WTL
          ref: 065ef5597383c1231bd4892cf8e94331b29bdb97
          path: vendor/WTL

      - name: Set up vcpkg binary cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('vcpkg.json', '.github/workflows/release-wtl.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-md-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.workflow }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet x64-windows-static-md

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DWTL_INCLUDE_DIR=$env:GITHUB_WORKSPACE/vendor/WTL/Include" `
            -DBUNGALOW_UI_BACKEND=wtl
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item resources package/resources -Recurse
          Copy-Item Apps package/Apps -Recurse
          Get-ChildItem package/Apps -Recurse -Filter *.xcf | Remove-Item
          Compress-Archive -Path package/* -DestinationPath bungalow-native-wtl-windows-x64.zip

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bungalow-native-wtl-windows-x64
          path: bungalow-native-wtl-windows-x64.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: bungalow-native-wtl-windows-x64.zip
